<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071719">
<title>Verdant Sentinel — Intercept Simulation</title>
<style>
:root{color-scheme:dark;--ink:#d9f6e8;--muted:#7ca99a;--lime:#b8ff72;--cyan:#81eddb}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071719;color:var(--ink);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}canvas{display:block;width:100%;height:100%;position:absolute;inset:0}.grain{position:absolute;inset:0;pointer-events:none;opacity:.14;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E")}header{position:absolute;top:0;left:0;right:0;padding:25px 34px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.brand{font-size:11px;letter-spacing:.2em;color:#a4d7c0}.brand strong{display:block;font:600 22px/1.2 system-ui,sans-serif;letter-spacing:-.04em;color:#e8fff1;margin-top:6px}.brand span{color:#80b9a1;font-size:10px;letter-spacing:.14em}.stats{display:flex;gap:26px;text-align:right}.stat label{display:block;font-size:9px;letter-spacing:.16em;color:#72998e;margin-bottom:5px}.stat b{font-size:18px;font-weight:500;color:#d9ffe7}.hudline{position:absolute;left:34px;right:34px;bottom:22px;display:flex;align-items:center;justify-content:space-between;font-size:9px;letter-spacing:.13em;color:#79a397;pointer-events:none}.hudline span:last-child{color:#54776d}.controls{position:absolute;z-index:2;right:32px;bottom:53px;display:flex;align-items:center;gap:9px}.controls button{background:rgba(15,42,39,.78);border:1px solid rgba(139,220,178,.24);color:#a8d7bb;border-radius:3px;padding:10px 12px;font:10px ui-monospace,monospace;letter-spacing:.08em;cursor:pointer;transition:.2s}.controls button:hover{border-color:#b8ff72;color:#e5ffce;background:#163c31}.controls .primary{background:#b8ff72;color:#112519;border-color:#b8ff72;font-weight:700}.controls .primary:hover{background:#d1ff9e}.hint{position:absolute;left:34px;bottom:54px;color:#53786b;font-size:9px;letter-spacing:.09em}.scan{position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 50%,rgba(0,0,0,.055) 50%);background-size:100% 4px;opacity:.42}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 45% 52%,transparent 40%,rgba(2,9,11,.65) 100%)}@media(max-width:700px){header{padding:19px}.brand strong{font-size:18px}.stats{gap:12px}.stat b{font-size:15px}.controls{right:19px;bottom:51px}.hint{left:19px;bottom:21px;font-size:8px}.hudline{left:19px;right:19px;bottom:8px}.hudline span:last-child{display:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="A living plant intercepts incoming alien creatures"></canvas><div class="grain"></div><div class="vignette"></div><div class="scan"></div>
<header><div class="brand">FIELD STUDY 07 <strong>Verdant Sentinel</strong><span>AN AUTONOMOUS INTERCEPTION SYSTEM</span></div><div class="stats"><div class="stat"><label>CONSUMED</label><b id="score">000</b></div><div class="stat"><label>IN FLIGHT</label><b id="active">00</b></div><div class="stat"><label>THREAT LEVEL</label><b id="level">LOW</b></div></div></header>
<div class="hint">A LIVING DEFENSE // WATCH IT ADAPT</div><div class="controls"><button id="pause">Ⅱ &nbsp; PAUSE</button><button id="burst">+ &nbsp; SEND A WAVE</button><button id="toggle" class="primary">↻ &nbsp; RESTART</button></div>
<div class="hudline"><span>BIOME 01 &nbsp; / &nbsp; THE GLASS MARSH</span><span>SPECIMENS ARE INTERCEPTED BEFORE THE BOUNDARY</span></div>
<script>
(()=>{'use strict';const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d',{alpha:false}),scoreEl=document.querySelector('#score'),activeEl=document.querySelector('#active'),levelEl=document.querySelector('#level');let W=0,H=0,D=1,plantX=0,ground=0,creatures=[],particles=[],tendrils=[],score=0,paused=false,last=0,spawnClock=0,elapsed=0,started=true;const TAU=Math.PI*2,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),rand=(a,b)=>a+Math.random()*(b-a),ease=x=>x*x*(3-2*x);
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);plantX=Math.min(W*.205,245);ground=H*.78;}
addEventListener('resize',resize);resize();
function spawn(x=W+35,y=rand(H*.19,H*.68),size=rand(9,15),speed=rand(100,165)){creatures.push({x,y,base:y,r:size,v:speed,phase:rand(0,TAU),freq:rand(1.5,3.4),amp:rand(18,54),rot:rand(0,TAU),spin:rand(-1.3,1.3),hp:1,age:0,glow:rand(0,1),caught:false,fade:0});}
function burst(){for(let i=0;i<9;i++)setTimeout(()=>spawn(W+rand(10,160),rand(H*.16,H*.72),rand(8,14),rand(145,225)),i*125)}
function reset(){score=0;elapsed=0;spawnClock=0;creatures=[];particles=[];tendrils=[];paused=false;document.querySelector('#pause').innerHTML='Ⅱ &nbsp; PAUSE';for(let i=0;i<5;i++)spawn(W+rand(0,W*.65),rand(H*.2,H*.68));}
document.querySelector('#burst').onclick=burst;document.querySelector('#pause').onclick=e=>{paused=!paused;e.currentTarget.innerHTML=paused?'▶ &nbsp; RESUME':'Ⅱ &nbsp; PAUSE'};document.querySelector('#toggle').onclick=reset;
function blob(x,y,r,color,alpha=1){ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.globalAlpha=1}
function splat(x,y,color,n=12){for(let i=0;i<n;i++){let a=rand(0,TAU),v=rand(35,180),life=rand(.35,.85);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life,max:life,r:rand(1,3.2),color})}}
function drawBackground(now){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#080f16');g.addColorStop(.53,'#13211f');g.addColorStop(1,'#050b11');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);let glow=ctx.createRadialGradient(W*.56,H*.49,4,W*.56,H*.49,W*.53);glow.addColorStop(0,'rgba(95,181,119,.09)');glow.addColorStop(1,'rgba(18,48,40,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
// drifting spores
for(let i=0;i<43;i++){let x=((i*173.7+now*(7+i%4)*.013)%W),y=(i*91.3+Math.sin(now*.0005+i)*22)%H;blob(x,y,1+(i%3)*.3,'#a9e8bd',.22)}
// horizon reeds
ctx.strokeStyle='rgba(70,127,99,.22)';ctx.lineWidth=1;for(let i=0;i<24;i++){let x=i*W/20+(i%3)*7;let h=24+(i*37%68);ctx.beginPath();ctx.moveTo(x,ground+5);ctx.quadraticCurveTo(x-13,ground-h*.54,x+Math.sin(now*.001+i)*8,ground-h);ctx.stroke()}
ctx.fillStyle='#0a1b1a';ctx.fillRect(0,ground,W,H-ground);ctx.strokeStyle='rgba(128,198,137,.25)';ctx.beginPath();ctx.moveTo(0,ground);ctx.lineTo(W,ground);ctx.stroke();ctx.setLineDash([2,13]);ctx.strokeStyle='rgba(119,196,145,.1)';ctx.beginPath();ctx.moveTo(plantX+54,0);ctx.lineTo(plantX+54,H);ctx.stroke();ctx.setLineDash([]);
}
function creatureDraw(c,now){let x=c.x,y=c.y,r=c.r,wiggle=Math.sin(now*.009+c.phase);ctx.save();ctx.translate(x,y);ctx.rotate(c.rot);ctx.shadowColor='#ff668a';ctx.shadowBlur=16;let grd=ctx.createRadialGradient(-r*.35,-r*.4,1,0,0,r*1.3);grd.addColorStop(0,'#ffd0a2');grd.addColorStop(.34,'#fd8292');grd.addColorStop(1,'#9d3c70');ctx.fillStyle=grd;ctx.beginPath();ctx.ellipse(0,0,r*1.08,r*.85,0,0,TAU);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,143,156,.85)';ctx.lineWidth=1.2;for(let s of [-1,1]){ctx.beginPath();ctx.moveTo(s*r*.48,r*.22);ctx.quadraticCurveTo(s*r*.92,r*.36+wiggle*2,s*r*1.05,r*.68+wiggle*2);ctx.stroke()}blob(-r*.25,-r*.1,r*.13,'#182126');blob(r*.25,-r*.1,r*.13,'#182126');blob(-r*.28,-r*.14,r*.045,'#fff4d5');blob(r*.22,-r*.14,r*.045,'#fff4d5');ctx.restore();
}
function leafPath(x,y,len,w,angle){ctx.save();ctx.translate(x,y);ctx.rotate(angle);let grad=ctx.createLinearGradient(0,0,len,0);grad.addColorStop(0,'#173d38');grad.addColorStop(.5,'#668b52');grad.addColorStop(1,'#263e35');ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(len*.35,-w*1.15,len,0);ctx.quadraticCurveTo(len*.35,w*1.15,0,0);ctx.fill();ctx.strokeStyle='rgba(197,224,139,.38)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(len*.48,0,len,0);ctx.stroke();ctx.restore()}
function drawPlant(now,dt){const sway=Math.sin(now*.0012)*.045,baseY=ground+14,stemTop=ground-H*.34,headX=plantX+48,headY=stemTop-8+Math.sin(now*.0017)*4;let grad=ctx.createLinearGradient(plantX,ground,plantX+55,stemTop);grad.addColorStop(0,'#183b36');grad.addColorStop(.6,'#538d57');grad.addColorStop(1,'#a8c66a');ctx.lineCap='round';ctx.lineWidth=13;ctx.strokeStyle=grad;ctx.beginPath();ctx.moveTo(plantX,baseY);ctx.bezierCurveTo(plantX+20,ground-60,plantX-11,stemTop+45,headX,headY);ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='rgba(214,255,154,.45)';ctx.beginPath();ctx.moveTo(plantX+2,baseY);ctx.bezierCurveTo(plantX+22,ground-60,plantX-9,stemTop+45,headX,headY);ctx.stroke();
leafPath(plantX+11,ground-76,60,18,-.24+Math.sin(now*.001)*.08);leafPath(plantX+22,ground-119,57,17,Math.PI+.28+Math.sin(now*.0014)*.08);leafPath(plantX+7,ground-42,42,14,Math.PI+.48);leafPath(plantX+23,ground-161,42,13,.38);
// Hooked thorns jut from the stalk like grasping barbs.
ctx.strokeStyle='#a4b66c';ctx.lineWidth=2.3;for(let k=0;k<5;k++){let yy=ground-53-k*29,side=k%2?1:-1;ctx.beginPath();ctx.moveTo(plantX+8,yy);ctx.quadraticCurveTo(plantX+side*16,yy-2,plantX+side*24,yy-12);ctx.stroke()}
// root mound
let rg=ctx.createRadialGradient(plantX,ground,2,plantX,ground,64);rg.addColorStop(0,'#59954c');rg.addColorStop(1,'rgba(23,70,48,0)');ctx.fillStyle=rg;ctx.beginPath();ctx.ellipse(plantX,ground+9,65,20,0,0,TAU);ctx.fill();
// hinged flower head
ctx.save();ctx.translate(headX,headY);ctx.rotate(sway);ctx.shadowColor='#9dff58';ctx.shadowBlur=24;let petal=ctx.createLinearGradient(-35,-8,17,13);petal.addColorStop(0,'#446b43');petal.addColorStop(.55,'#b2c36c');petal.addColorStop(1,'#74884c');ctx.fillStyle=petal;
// A hooked, tooth-lined maw frames a dark throat.
ctx.beginPath();ctx.moveTo(-4,-9);ctx.quadraticCurveTo(-30,-38,-42,-7);for(let i=0;i<9;i++){let x=-42+i*9.5;ctx.lineTo(x+4,-3+(i%2?6:0));ctx.lineTo(x+8,-9)}ctx.quadraticCurveTo(0,8,35,-5);ctx.quadraticCurveTo(45,2,42,14);ctx.lineTo(30,13);ctx.lineTo(23,5);ctx.lineTo(17,18);ctx.lineTo(10,7);ctx.lineTo(3,20);ctx.lineTo(-4,7);ctx.lineTo(-14,16);ctx.lineTo(-18,3);ctx.lineTo(-34,13);ctx.quadraticCurveTo(-43,7,-35,-1);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#130d17';ctx.beginPath();ctx.ellipse(-1,3,25,10,-.04,0,TAU);ctx.fill();ctx.strokeStyle='rgba(225,255,158,.38)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-26,-5);ctx.quadraticCurveTo(0,-14,29,-5);ctx.stroke();blob(4,2,3.2,'#ff526a');blob(3,1,1.3,'#ffe4b0');ctx.restore();
// tendrils form smooth Bezier paths and retract after feeding
for(let i=tendrils.length-1;i>=0;i--){let q=tendrils[i];q.age+=dt;let target=creatures.find(c=>c.id===q.target);if(!target||target.caught)q.retract=true;let reach=target?Math.hypot(target.x-headX,target.y-headY):q.length;let prog=q.retract?clamp(1-q.age/.32,0,1):clamp(q.age/.21,0,1);let ex=target&&!q.retract?headX+(target.x-headX)*Math.min(1,prog*1.8):headX+q.dx*prog,ey=target&&!q.retract?headY+(target.y-headY)*Math.min(1,prog*1.8):headY+q.dy*prog;if(!q.retract&&target&&Math.hypot(ex-target.x,ey-target.y)<target.r+7){target.caught=true;target.fade=0;splat(target.x,target.y,'#bcff70',16);score++;q.retract=true}ctx.beginPath();ctx.moveTo(headX,headY);ctx.bezierCurveTo(headX+q.dx*.35,headY+q.dy*.15,ex-q.dy*.22,ey+q.dx*.12,ex,ey);ctx.strokeStyle=q.retract?'rgba(128,226,105,.55)':'#c1ff76';ctx.lineWidth=q.retract?2.1:rand(2.6,4.1);ctx.shadowColor='#aaff63';ctx.shadowBlur=10;ctx.stroke();ctx.shadowBlur=0;let tip=ctx.createRadialGradient(ex,ey,0,ex,ey,5);tip.addColorStop(0,"#f5ffb0");tip.addColorStop(1,"rgba(190,255,105,0)");ctx.fillStyle=tip;ctx.beginPath();ctx.arc(ex,ey,5,0,TAU);ctx.fill();if(q.age>(q.retract?.32:.75))tendrils.splice(i,1)}
}
let id=0;function frame(now){requestAnimationFrame(frame);if(!last)last=now;let dt=Math.min((now-last)/1000,.033);last=now;if(!paused){elapsed+=dt;spawnClock+=dt;let interval=Math.max(.38,1.35-elapsed*.006);if(spawnClock>interval){spawnClock=0;spawn(W+20,rand(H*.17,H*.71),rand(8,14),rand(125,190)+Math.min(100,elapsed*1.2))}for(const c of creatures){if(c.caught){c.fade+=dt;c.x+=(plantX+48-c.x)*Math.min(1,dt*5);c.y+=(ground-H*.34-c.y)*Math.min(1,dt*5);if(c.fade>.34)c.remove=true;continue}c.age+=dt;c.x-=c.v*dt;c.y=c.base+Math.sin(c.age*c.freq+c.phase)*c.amp+Math.sin(c.age*5+c.phase)*6;c.rot+=c.spin*dt;
// Independent local steering tendril seeks the earliest reachable incoming target.
if(c.x<plantX+W*.32&&c.x>plantX+50&&!c.attacked){let active=tendrils.length;if(active<8&&Math.random()<dt*5.0){c.attacked=true;let dx=c.x-(plantX+48),dy=c.y-(ground-H*.34);tendrils.push({target:c.id,dx,dy,length:Math.hypot(dx,dy),age:0,retract:false})}}
// Absolute interception guarantee: emergency root pulse catches any escaped target.
if(c.x-c.r<plantX+12){c.caught=true;c.fade=0;splat(c.x,c.y,'#bcff70',18);score++}}
creatures=creatures.filter(c=>!c.remove&&c.x>-50);for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy=p.vy*.97+24*dt}particles=particles.filter(p=>p.life>0)}
drawBackground(now);drawPlant(now,dt);for(const c of creatures)if(!c.caught)creatureDraw(c,now);for(const c of creatures)if(c.caught){ctx.globalAlpha=clamp(1-c.fade/.34,0,1);creatureDraw(c,now);ctx.globalAlpha=1}for(const p of particles){blob(p.x,p.y,p.r*(p.life/p.max),p.color,p.life/p.max)}
// Ambient plant bioluminescence
for(let i=0;i<7;i++){let a=now*.0004+i*TAU/7,x=plantX+Math.cos(a)*34,y=ground-H*.2+Math.sin(a)*45;blob(x,y,1.5,'#c5ff94',.5)}
scoreEl.textContent=String(score).padStart(3,'0');activeEl.textContent=String(creatures.filter(c=>!c.caught).length).padStart(2,'0');let threat=creatures.filter(c=>!c.caught&&c.x<plantX+W*.4).length;levelEl.textContent=threat>5?'SEVERE':threat>2?'ELEVATED':'LOW';levelEl.style.color=threat>5?'#ff8391':threat>2?'#ffd27c':'#d9ffe7';if(paused){ctx.fillStyle='rgba(5,15,15,.36)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.font='11px ui-monospace,monospace';ctx.fillStyle='#d9ffe7';ctx.fillText('SIMULATION PAUSED',W/2,H/2)}}
// Give every creature a stable target key.
const oldSpawn=spawn;spawn=function(...args){oldSpawn(...args);creatures[creatures.length-1].id=++id};reset();requestAnimationFrame(frame);
})();
</script></body></html>
